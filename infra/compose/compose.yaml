services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: along
      POSTGRES_PASSWORD: along
      POSTGRES_DB: along
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U along -d along']
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - '${DB_PORT:-55432}:5432'
  api:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    command: ['bun', '--no-env-file', 'apps/api/dist/main.js']
    environment:
      ROLE: all
      PORT: '3000'
      TZDB_VERSION: ${TZDB_VERSION:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://along:along@postgres:5432/along}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      # API-only process environment; run Compose with COMPOSE_DISABLE_ENV_FILE=1.
      FEISHU_BOT_DOCX_CONFIG:
      FEISHU_BOT_DOCX_APP_SECRET:
      FEISHU_BOT_DOCX_OBSERVATION_KEY:
      # Optional historical receipt verification; no user OAuth flows.
      FEISHU_APP_ID:
      FEISHU_REDIRECT_URI:
      FEISHU_CREDENTIAL_KEY:
      MODEL_PROVIDER_ENCRYPTION_KEY: ${MODEL_PROVIDER_ENCRYPTION_KEY:-}
      MODEL_PROVIDER_ALLOWED_LOCAL_ORIGINS: ${MODEL_PROVIDER_ALLOWED_LOCAL_ORIGINS:-}
      MODEL_PROVIDER_ALLOWED_FAKE_DNS_ORIGINS: ${MODEL_PROVIDER_ALLOWED_FAKE_DNS_ORIGINS:-}
      HARNESS_MAX_ITERATIONS: ${HARNESS_MAX_ITERATIONS:-24}
      HARNESS_MAX_TOKENS: ${HARNESS_MAX_TOKENS:-64000}
      HARNESS_COMPLETION_CAP: ${HARNESS_COMPLETION_CAP:-}
      HARNESS_MODEL_WINDOW_TOKENS: ${HARNESS_MODEL_WINDOW_TOKENS:-}
      HARNESS_CONTEXT_RESERVE_TOKENS: ${HARNESS_CONTEXT_RESERVE_TOKENS:-0}
      HARNESS_ROUTING_MODE: ${HARNESS_ROUTING_MODE:-off}
      HARNESS_ROUTING_BUNDLE: ${HARNESS_ROUTING_BUNDLE:-}
      HARNESS_ROUTING_ENCODER_URL: ${HARNESS_ROUTING_ENCODER_URL:-}
      HARNESS_ROUTING_INTENTS: ${HARNESS_ROUTING_INTENTS:-}
      WORKSPACE_REGISTRY_FILE: ${WORKSPACE_REGISTRY_FILE:-}
    ports:
      - '3000:3000'
    volumes:
      - workspace_data:/var/lib/along/workspaces
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  workspace_data:
