services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: along
      POSTGRES_PASSWORD: along
      POSTGRES_DB: along
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U along -d along']
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - '${DB_PORT:-55432}:5432'
  api:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    environment:
      ROLE: all
      PORT: '3000'
      TZDB_VERSION: ${TZDB_VERSION:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://along:along@postgres:5432/along}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      HARNESS_MODEL_BASE_URL: ${HARNESS_MODEL_BASE_URL:-}
      HARNESS_MODEL: ${HARNESS_MODEL:-}
      HARNESS_MODEL_API_KEY: ${HARNESS_MODEL_API_KEY:-}
      HARNESS_MAX_ITERATIONS: ${HARNESS_MAX_ITERATIONS:-24}
      HARNESS_MAX_TOKENS: ${HARNESS_MAX_TOKENS:-64000}
      WORKSPACE_REGISTRY_FILE: ${WORKSPACE_REGISTRY_FILE:-}
    ports:
      - '3000:3000'
    volumes:
      - workspace_data:/var/lib/along/workspaces
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  workspace_data:
