name: ci

on:
  push:
    branches: ['main']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Pacific/Kiritimati
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks
        id: scope
        run: node scripts/ci/select-scope.mjs
      - uses: ./.github/actions/setup
      - name: Check documentation
        if: steps.scope.outputs.scope == 'docs'
        run: |
          bun scripts/scan-copy-claims.mjs
          bunx --bun --no-install openspec validate --all --strict
          bun run format:check
      - name: Verify code
        if: steps.scope.outputs.scope != 'docs'
        run: bun run verify
      - name: Build Web
        if: steps.scope.outputs.scope == 'web'
        run: bun run --bun --filter @along/web build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks
        id: scope
        run: node scripts/ci/select-scope.mjs
      - uses: ./.github/actions/setup
        if: steps.scope.outputs.scope != 'docs' && steps.scope.outputs.scope != 'web'
      - name: Run applicable integration checks
        if: steps.scope.outputs.scope != 'docs' && steps.scope.outputs.scope != 'web'
        env:
          CI_SCOPE: ${{ steps.scope.outputs.scope }}
          CI_API_TESTS: ${{ steps.scope.outputs.api_tests }}
        run: bash scripts/ci/run-integration.sh
