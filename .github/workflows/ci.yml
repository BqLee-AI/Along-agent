name: ci

on:
  push:
    branches: ['main']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.select.outputs.plan }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select affected checks (${{ github.sha }})
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/select-scope.mjs

  checks:
    needs: plan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Pacific/Kiritimati
      OPENSPEC_TELEMETRY: '0'
    steps:
      - name: Require validation plan
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$PLAN_RESULT" = success
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check documentation
        run: bun scripts/ci/checks.mjs docs
      - name: Check Web
        if: contains(fromJSON(needs.plan.outputs.plan).checks, 'web')
        run: bun scripts/ci/checks.mjs web
      - name: Check API
        if: contains(fromJSON(needs.plan.outputs.plan).checks, 'api')
        run: bun scripts/ci/checks.mjs api
      - name: Check packages
        if: contains(fromJSON(needs.plan.outputs.plan).checks, 'packages')
        run: bun scripts/ci/checks.mjs packages
      - name: Check tooling
        if: contains(fromJSON(needs.plan.outputs.plan).checks, 'tooling')
        run: bun scripts/ci/checks.mjs tooling
      - name: Check harness
        if: contains(fromJSON(needs.plan.outputs.plan).checks, 'harness')
        run: bun scripts/ci/checks.mjs harness

  database:
    needs: plan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require validation plan
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$PLAN_RESULT" = success
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: fromJSON(needs.plan.outputs.plan).database.mode != 'none'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: fromJSON(needs.plan.outputs.plan).database.mode != 'none'
      - name: Verify PostgreSQL
        if: fromJSON(needs.plan.outputs.plan).database.mode != 'none'
        env:
          CI_SCOPE: ${{ fromJSON(needs.plan.outputs.plan).database.mode }}
          CI_API_TESTS: ${{ join(fromJSON(needs.plan.outputs.plan).database.tests, ' ') }}
        run: bash scripts/ci/database.sh

  integration:
    needs: plan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require validation plan
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$PLAN_RESULT" = success
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: fromJSON(needs.plan.outputs.plan).runtime
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: fromJSON(needs.plan.outputs.plan).runtime
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: fromJSON(needs.plan.outputs.plan).runtime
        with:
          path: ${{ runner.temp }}/along-build-cache
          key: ${{ runner.os }}-runtime-${{ hashFiles('infra/docker/Dockerfile', 'apps/harness/artifacts.lock', 'bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-runtime-${{ hashFiles('infra/docker/Dockerfile', 'apps/harness/artifacts.lock', 'bun.lock') }}-
            ${{ runner.os }}-runtime-
      - name: Verify production runtime
        if: fromJSON(needs.plan.outputs.plan).runtime
        env:
          CI_DOCKER_CACHE: ${{ runner.temp }}/along-build-cache
        run: bash scripts/ci/runtime.sh
