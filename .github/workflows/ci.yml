name: ci

on:
  push:
    branches: ['main']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Pacific/Kiritimati
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks
        id: scope
        run: node scripts/ci/select-scope.mjs
      - uses: ./.github/actions/setup
      - name: Check documentation
        if: steps.scope.outputs.scope == 'docs'
        run: |
          bun scripts/scan-copy-claims.mjs
          bunx --bun --no-install openspec validate --all --strict
          bun run format:check
      - name: Verify code
        if: steps.scope.outputs.scope != 'docs'
        run: bun run verify
      - name: Build Web
        if: steps.scope.outputs.scope == 'web' || steps.scope.outputs.scope == 'full'
        run: bun run --bun --filter @along/web build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks
        id: scope
        run: node scripts/ci/select-scope.mjs
      - uses: ./.github/actions/setup
        if: steps.scope.outputs.scope != 'docs' && steps.scope.outputs.scope != 'web'
      - name: Verify PostgreSQL
        if: steps.scope.outputs.scope != 'docs' && steps.scope.outputs.scope != 'web'
        env:
          CI_SCOPE: ${{ steps.scope.outputs.scope }}
          CI_API_TESTS: ${{ steps.scope.outputs.api_tests }}
        run: bash scripts/ci/database.sh

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks
        id: scope
        run: node scripts/ci/select-scope.mjs
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.scope.outputs.scope == 'full' || steps.scope.outputs.scope == 'api'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.scope.outputs.scope == 'full' || steps.scope.outputs.scope == 'api'
        with:
          path: ${{ runner.temp }}/along-build-cache
          key: ${{ runner.os }}-runtime-${{ hashFiles('infra/docker/Dockerfile', 'apps/harness/artifacts.lock', 'bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-runtime-${{ hashFiles('infra/docker/Dockerfile', 'apps/harness/artifacts.lock', 'bun.lock') }}-
            ${{ runner.os }}-runtime-
      - name: Verify production runtime
        if: steps.scope.outputs.scope == 'full' || steps.scope.outputs.scope == 'api'
        env:
          CI_DOCKER_CACHE: ${{ runner.temp }}/along-build-cache
        run: bash scripts/ci/runtime.sh
